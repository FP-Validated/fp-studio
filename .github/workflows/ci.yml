name: FP Studio source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-sdk-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]' playwright
      - run: npm install
      - run: python scripts/build_ui.py
      - run: npm run test:sdk
      - run: python -m playwright install --with-deps chromium
      - run: FP_BROWSER=1 python -m pytest -q --junitxml=build/tests.xml
      - run: bash -n scripts/*.sh packaging/*.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-test-results
          path: build/tests.xml
  original-source-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/bootstrap.py
      - run: python -m pip install -e vendor/openworker
      - run: npm install && npm run build:sdk
      - run: FP_REQUIRE_INTEGRATION=1 python -m pytest -m upstream -q
      # Real FP SVG/PNG integration additionally needs the team's licensed font directory.
      # It is mandatory in packaging/build_dmg.sh, not silently replaced by a system font here.
